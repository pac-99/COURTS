<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COURTS 2.0 – Find your game. Anytime.</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="v2.css">
</head>
<body data-track="vision">
<div class="app">
  <header class="top">
    <div class="brand"><img src="images/logo.png" alt="COURTS" onload="this.nextElementSibling.style.display='none'"><span>COURTS</span><small>2.0</small></div>
    <nav class="navtop" id="navtop"></nav>
    <div class="seg" id="trackSeg" role="tablist" aria-label="Data source">
      <button data-track="vision" title="Court status from camera + Roboflow computer vision"><span class="dot"></span>Vision</button>
      <button data-track="community" title="Court status from player check-ins"><span class="dot"></span>Community</button>
    </div>
  </header>

  <main>
    <section class="view explore" id="v-explore">
      <aside class="panel" id="panel"></aside>
      <div class="mapwrap">
        <div id="map"></div>
        <div class="maptools">
          <button class="mbtn" id="locBtn">Locate me</button>
          <button class="mbtn" id="fitBtn">Show all</button>
        </div>
        <div class="legend" id="legend"><span><i style="background:var(--green)"></i>Open</span><span><i style="background:var(--amber)"></i>Busy</span><span><i style="background:var(--red)"></i>Full</span><span><i style="background:var(--grey)"></i>No data</span></div>
      </div>
    </section>
    <section class="view hidden" id="v-lab"></section>
    <section class="view hidden" id="v-alerts"></section>
    <section class="view hidden" id="v-profile"></section>
  </main>

  <nav class="bottom" id="navbot"></nav>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="v2-data.js"></script>
<script src="v2.js"></script>
</body>
</html>
